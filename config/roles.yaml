roles:
  locations:
    - "ho chi minh"
    - "hcmc"
    - "\\bhcm\\b"
    - "saigon"
    - "sài gòn"
    - "tp\\.?\\s*hcm"
  excludeLevels:
    # Too junior for ~3 YOE
    - "intern"
    - "internship"
    - "fresher"
    - "fresh graduate"
    - "trainee"
    - "co-op"
    # Too senior / management for Junior-Middle (~3 YOE)
    - "senior"
    - "sr\\."
    - "lead"
    - "principal"
    - "staff"
    - "architect"
    - "manager"
    - "director"
    - "head of"
    - "\\bvp\\b"
    - "vice president"
    - "chief"
    - "distinguished"
  include:
    - pattern: "(?:software|systems?|platform|infrastructure)\\s+(?:engineer|developer)|developer"
      category: "software-engineer"
    - pattern: "backend|back-end|api|server|golang|node\\.?js|python|java|kotlin|\\.net"
      category: "backend"
    - pattern: "fullstack|full-stack|full\\s+stack"
      category: "fullstack"
    - pattern: "ai\\s*(?:agent|engineer|ops|developer)|machine\\s*learning|ml\\s*(?:engineer|ops)|deep\\s*learning|llm|nlp"
      category: "ai-agent"
  exclude:
    - "embedded"
    - "automotive"
    - "autosar"
    - "firmware"
    - "bootloader"
    - "telematics"
    - "hmi"
    - "c\\+\\+"
    - "sales"
    - "civil"
    - "mechanical"
    - "hr\\b"
    - "human resources"
    - "recruiter"
    - "talent acquisition"
    - "marketing"
    - "accountant"
    - "legal"
    - "customer support"
    - "call center"
